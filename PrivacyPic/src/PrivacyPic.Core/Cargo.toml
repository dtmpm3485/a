[package]
name = "privacypic_core"
version = "2.0.0"
edition = "2021"

[lib]
name = "privacypic_core"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
signature = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
