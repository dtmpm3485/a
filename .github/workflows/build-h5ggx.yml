name: Build H5GGX dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Index.html'
      - 'src/**'
      - '.github/workflows/build-h5ggx.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout H5GGX overlay
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check src/h5ggx.js
          node --check src/h5ggx-pro.js

      - name: Build embedded H5 UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('Index.html').read_text(encoding='utf-8')
          css = Path('src/style.css').read_text(encoding='utf-8')
          js = Path('src/h5ggx.js').read_text(encoding='utf-8')

          # Inline all UI assets. H5GG embeds Index.html into the dylib, so relative
          # src/href files do not exist at runtime.
          html, css_n = re.subn(
              r'<link\b[^>]*href=["\']src/style\.css["\'][^>]*>',
              '<style>\n' + css + '\n</style>',
              html,
              flags=re.IGNORECASE
          )
          html, js_n = re.subn(
              r'<script\b[^>]*src=["\']src/h5ggx\.js["\'][^>]*>\s*</script>',
              '<script>\n' + js + '\n</script>',
              html,
              flags=re.IGNORECASE
          )
          if css_n != 1 or js_n != 1:
              raise SystemExit(f'asset inline failed: css={css_n}, js={js_n}')
          if 'src/style.css' in html or 'src/h5ggx.js' in html:
              raise SystemExit('external H5GGX asset reference remains')
          Path('H5GGX-Embedded.html').write_text(html, encoding='utf-8')
          PY

      - name: Checkout upstream H5GG
        run: git clone --recursive --depth 1 https://github.com/H5GG/H5GG.git upstream

      - name: Install Theos
        run: |
          brew install ldid xz || true
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Integrate H5GGX into H5GG core
        run: |
          cp H5GGX-Embedded.html upstream/Index.html
          cp H5GGX-Embedded.html upstream/Index-en.html
          python3 - <<'PY'
          from pathlib import Path

          # Preload system headers outside upstream's extern-C block so Xcode modules
          # do not get imported from inside C linkage, while preserving C symbols.
          cp = Path('upstream/crossproc.h')
          c = cp.read_text()
          preload = '''#include <sys/cdefs.h>\n#include <sys/_types.h>\n#include <sys/param.h>\n#include <sys/types.h>\n#include <sys/mount.h>\n#include <sys/socket.h>\n#include <sys/un.h>\n#include <net/if.h>\n#include <netinet/in.h>\n'''
          anchor = '#import <mach-o/dyld_images.h>\n'
          if preload not in c:
              c = c.replace(anchor, anchor + preload)
          cp.write_text(c)

          lp = Path('upstream/ldid-master/ldid.cpp')
          l = lp.read_text()
          guard = '#pragma clang diagnostic ignored "-Wmacro-redefined"\n#pragma clang diagnostic ignored "-Wunused-but-set-variable"\n'
          if guard not in l:
              l = guard + l
          lp.write_text(l)

          p=Path('upstream/Makefile')
          s=p.read_text()
          s=s.replace('TARGET = iphone:13.7:11.4','TARGET = iphone:clang:latest:11.0')
          s += '\nH5GG_CFLAGS += -Wno-error -Wno-module-import-in-extern-c\n'
          s += 'H5GG_CCFLAGS += -Wno-error -Wno-macro-redefined -Wno-unused-but-set-variable -Wno-module-import-in-extern-c\n'
          marker='H5GG_LOGOS_DEFAULT_GENERATOR = internal'
          if 'H5GG_FRAMEWORKS =' not in s:
              s=s.replace(marker, 'H5GG_FRAMEWORKS = UIKit Foundation JavaScriptCore SystemConfiguration CoreGraphics\n'+marker)
          p.write_text(s)
          PY

      - name: Build ARM64 H5GGX
        working-directory: upstream
        run: |
          export THEOS="$HOME/theos"
          make clean
          make -j2

      - name: Collect dylib
        run: |
          mkdir -p output
          DYLIB=$(find upstream/.theos -type f -name 'H5GG.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" output/H5GGX.dylib
          file output/H5GGX.dylib
          ls -lh output/H5GGX.dylib

      - name: Upload H5GGX dylib
        uses: actions/upload-artifact@v4
        with:
          name: H5GGX-arm64
          path: output/H5GGX.dylib
          if-no-files-found: error
