name: Build PrivacyPic FINAL 5-Language

on:
  push:
    branches:
      - privacypic-final-5lang
    paths:
      - "PrivacyPic/**"
      - ".github/workflows/build-privacypic-final.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Zig 0.13
        uses: mlugg/setup-zig@v2
        with:
          version: "0.13.0"

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Rust security core
        working-directory: PrivacyPic/src/PrivacyPic.Core
        run: |
          rustc --version
          cargo build --release

      - name: Publish C# UI
        run: |
          dotnet publish PrivacyPic/src/PrivacyPic.App/PrivacyPic.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o PrivacyPic/out/App
          if (-not (Test-Path "PrivacyPic/out/App/PrivacyPicApp.exe")) { throw "PrivacyPicApp.exe missing" }

      - name: Inject app and core hashes into C++ guard
        run: |
          $appHash = (Get-FileHash "PrivacyPic/out/App/PrivacyPicApp.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $coreHash = (Get-FileHash "PrivacyPic/src/PrivacyPic.Core/target/release/privacypic_core.dll" -Algorithm SHA256).Hash.ToLowerInvariant()

          $path = "PrivacyPic/src/PrivacyPic.Guard/guard.cpp"
          $text = Get-Content -Raw -Encoding UTF8 $path
          if (-not $text.Contains("__APP_SHA256__")) { throw "APP hash placeholder missing" }
          if (-not $text.Contains("__CORE_SHA256__")) { throw "CORE hash placeholder missing" }
          $text = $text.Replace("__APP_SHA256__", $appHash)
          $text = $text.Replace("__CORE_SHA256__", $coreHash)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Build C++ native guard
        run: |
          New-Item -ItemType Directory -Force PrivacyPic/out/Guard | Out-Null
          cl /nologo /LD /EHsc /O2 /std:c++17 PrivacyPic/src/PrivacyPic.Guard/guard.cpp /link /OUT:PrivacyPic/out/Guard/privacypic_guard.dll bcrypt.lib advapi32.lib
          if (-not (Test-Path "PrivacyPic/out/Guard/privacypic_guard.dll")) { throw "guard dll missing" }

      - name: Build Zig launcher
        run: |
          New-Item -ItemType Directory -Force PrivacyPic/out/Launcher | Out-Null
          Push-Location PrivacyPic/src/PrivacyPic.Launcher
          zig build-exe main.zig -O ReleaseSmall -target x86_64-windows -fstrip
          Pop-Location
          Move-Item PrivacyPic/src/PrivacyPic.Launcher/main.exe PrivacyPic/out/Launcher/PrivacyPic.exe -Force
          editbin /NOLOGO /SUBSYSTEM:WINDOWS PrivacyPic/out/Launcher/PrivacyPic.exe
          if (-not (Test-Path "PrivacyPic/out/Launcher/PrivacyPic.exe")) { throw "launcher missing" }

      - name: Build JavaFX license manager
        working-directory: PrivacyPic/src/PrivacyPic.LicenseManager.Java
        run: |
          mvn -B clean package dependency:copy-dependencies -DoutputDirectory=target/package-input
          Copy-Item target/license-manager-2.0.0.jar target/package-input/license-manager-2.0.0.jar
          New-Item -ItemType Directory -Force ../../out/JavaManager | Out-Null
          jpackage --type app-image --name PrivacyPicLicenseManager --input target/package-input --main-jar license-manager-2.0.0.jar --main-class jp.privacypic.license.Launcher --dest ../../out/JavaManager --java-options "-Dfile.encoding=UTF-8"

      - name: Stage public-safe raw binaries
        run: |
          New-Item -ItemType Directory -Force PrivacyPic/stage/UserRaw | Out-Null
          New-Item -ItemType Directory -Force PrivacyPic/stage/OwnerRaw | Out-Null

          Copy-Item PrivacyPic/out/Launcher/PrivacyPic.exe PrivacyPic/stage/UserRaw/PrivacyPic.exe
          Copy-Item PrivacyPic/out/App/PrivacyPicApp.exe PrivacyPic/stage/UserRaw/PrivacyPicApp.exe
          Copy-Item PrivacyPic/src/PrivacyPic.Core/target/release/privacypic_core.dll PrivacyPic/stage/UserRaw/privacypic_core.dll
          Copy-Item PrivacyPic/out/Guard/privacypic_guard.dll PrivacyPic/stage/UserRaw/privacypic_guard.dll

          Copy-Item -Recurse PrivacyPic/out/JavaManager/PrivacyPicLicenseManager PrivacyPic/stage/OwnerRaw/PrivacyPicLicenseManager

      - name: Upload safe raw binaries
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyPic-FINAL-Raw
          path: PrivacyPic/stage
          if-no-files-found: error
          retention-days: 1
