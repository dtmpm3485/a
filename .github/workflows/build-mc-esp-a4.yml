name: Build MC ESP A7

on:
  push:
    branches:
      - mc-esp-2644
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Clone launcher
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Bedrock-Cosmos/PocketCosmosLevi.git launcher

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply ESP patch
        run: |
          cp mc_esp_a4/mcesp2644.c launcher/app/src/main/cpp/mcesp2644.c
          cp mc_esp_a4/EspOverlayView.java launcher/app/src/main/java/org/levimc/launcher/core/minecraft/EspOverlayView.java
          python3 mc_esp_a4/patch_launcher.py

      - name: Build APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            echo "Gradle build attempt $attempt/4"
            if ./gradlew :app:assembleDebug --stacktrace --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Dependency/network failure; retrying..."
              sleep 20
            fi
          done
          exit 1

      - name: Collect
        run: |
          mkdir -p out
          APK=$(find launcher/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          cp "$APK" out/MCESP-26.44.3-A7.apk
          sha256sum out/MCESP-26.44.3-A7.apk > out/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MCESP-26.44.3-A7
          path: out/
          if-no-files-found: error
