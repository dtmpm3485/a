name: Build MC ESP A4 Current Launcher

on:
  push:
    branches:
      - mc-esp-2644
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Clone current launcher
        run: |
          git clone --recursive https://github.com/Bedrock-Cosmos/PocketCosmosLevi.git launcher

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"

      - name: Patch launcher with ESP
        run: |
          cp mc_esp_a4/mcesp2644.c launcher/app/src/main/cpp/mcesp2644.c
          mkdir -p launcher/app/src/main/java/org/levimc/launcher/core/minecraft
          cp mc_esp_a4/EspOverlayView.java launcher/app/src/main/java/org/levimc/launcher/core/minecraft/EspOverlayView.java

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("launcher")

          # Add ESP library to launcher CMake.
          p = root / "app/src/main/cpp/CMakeLists.txt"
          s = p.read_text()
          patch = '''
          find_package(shadowhook REQUIRED CONFIG)

          add_library(mcesp2644 SHARED mcesp2644.c)
          target_link_libraries(mcesp2644 PRIVATE android log m shadowhook::shadowhook)
          '''
          if "add_library(mcesp2644" not in s:
              s += "\n" + patch + "\n"
          p.write_text(s)

          # Add ShadowHook prefab dependency.
          p = root / "app/build.gradle"
          s = p.read_text()
          needle = "dependencies {"
          if 'com.bytedance.android:shadowhook:2.0.0' not in s:
              s = s.replace(needle, needle + '\n    implementation "com.bytedance.android:shadowhook:2.0.0"')
          p.write_text(s)

          # Attach ESP only after Minecraft activity reaches resumed state.
          p = root / "app/src/main/java/org/levimc/launcher/core/minecraft/MinecraftActivity.kt"
          s = p.read_text()
          old = '''        if (overlayManager == null) {
              startInbuiltModServices()
          }
      }'''
          new = '''        if (overlayManager == null) {
              startInbuiltModServices()
          }
          EspOverlayView.attachAndInstall(this)
      }'''
          if old not in s:
              raise SystemExit("MinecraftActivity onResume block not found")
          s = s.replace(old, new, 1)
          p.write_text(s)

          # CI-only Firebase placeholder; ESP does not depend on Firebase.
          gs = {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mc-esp-ci",
              "storage_bucket": "mc-esp-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {"package_name": "org.levimc.launcher"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyCIOnlyPlaceholderKey"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          (root / "app/google-services.json").write_text(json.dumps(gs))
          (root / "local.properties").write_text("curseforge.api_key=\n")
          PY

      - name: Build debug APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find launcher/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          cp "$APK" out/MCESP-26.44.3-A4.apk
          sha256sum out/MCESP-26.44.3-A4.apk | tee out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCESP-26.44.3-A4
          path: out/
          if-no-files-found: error
